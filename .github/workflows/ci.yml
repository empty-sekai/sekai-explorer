name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the core revision
        id: core
        run: |
          echo "repository=$(jq -r .repository core.lock.json)" >> "$GITHUB_OUTPUT"
          echo "rev=$(jq -r .rev core.lock.json)" >> "$GITHUB_OUTPUT"
          echo "bindgen=$(jq -r '."wasm-bindgen"' core.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.rev }}
          path: core-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-source
      - name: Build the core
        run: |
          cargo install wasm-bindgen-cli --version ${{ steps.core.outputs.bindgen }} --locked
          cargo build --release -p sekai-wasm --target wasm32-unknown-unknown --manifest-path core-source/Cargo.toml
          wasm-bindgen --target web --out-dir core-package core-source/target/wasm32-unknown-unknown/release/sekai_wasm.wasm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34
      - run: bun install --frozen-lockfile
      - run: bun run core
        env:
          SEKAI_CORE_DIR: core-package
      - run: bun run check
      - run: bun run i18n
      - run: bun run build
      - run: bun run test
